version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: weather-postgres
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_archive_local
      POSTGRES_DB: weather_archive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sam-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  sam-local:
    name: sam-local
    driver: bridge
